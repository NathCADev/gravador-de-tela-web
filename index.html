<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grave a tela, janela ou aba com áudio do sistema e microfone. Tudo no navegador, sem instalação." />
    <meta name="theme-color" content="#121315" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:;"
    />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg?v=2" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png?v=2" />
    <title>Gravador de tela</title>
    <script>
      try {
        var t = localStorage.getItem('gravador-tema');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="sr-live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
